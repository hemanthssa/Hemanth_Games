<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Player Figure Preview</title>
<style>
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 40px 20px;
    font-family: sans-serif;
    color: #fff;
  }
  h2 { margin: 0; font-size: 14px; color: #aaa; letter-spacing: 1px; text-transform: uppercase; }

  /* ── Table ── */
  .table-wrap {
    position: relative;
    width: 360px;
    height: 400px;
  }
  /* Wood rim */
  .table-wrap::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 22px;
    background: linear-gradient(160deg, #c8933a 0%, #8b5e1a 50%, #5c3a0a 100%);
    box-shadow: 0 0 0 2px #6b4310, 0 10px 44px #00000095, inset 0 2px 6px #ffffff18;
  }
  /* Felt */
  .table-wrap::after {
    content: '';
    position: absolute; inset: 10px;
    border-radius: 14px;
    background: radial-gradient(ellipse at 40% 35%, #2d7a50 0%, #1a5c38 50%, #0e3b24 100%);
    box-shadow: inset 0 4px 32px #00000050, inset 0 0 0 1px #3da06830;
  }

  /* Figures sit outside the table */
  .figure {
    position: absolute;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .figure svg { display: block; }
  .figure-label {
    font-size: 10px;
    font-weight: 700;
    color: #ffffffcc;
    text-shadow: 0 1px 4px #000;
    white-space: nowrap;
  }

  /* Positions */
  .fig-top    { top: -74px;  left: 50%; transform: translateX(-50%) rotate(180deg); }
  .fig-left   { left: -64px; top: 50%;  transform: translateY(-50%) rotate(90deg); }
  .fig-right  { right: -64px;top: 50%;  transform: translateY(-50%) rotate(-90deg); }
  .fig-bottom { bottom: -74px; left: 50%; transform: translateX(-50%); }

  /* Active glow */
  .active svg {
    filter: drop-shadow(0 0 8px #FFD700) drop-shadow(0 0 22px #FFD70080);
  }

  /* Single figure preview row */
  .preview-row {
    display: flex;
    gap: 48px;
    align-items: flex-end;
  }
  .single-fig {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .single-fig h3 { font-size: 12px; color: #888; margin: 0; }
  .glow svg {
    filter: drop-shadow(0 0 8px #FFD700) drop-shadow(0 0 22px #FFD70080);
  }
</style>
</head>
